<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shared Calendar</title>
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body class="light">
    <h1 class="title">Shared Calendar</h1>
    <a href="index.html" class="back-btn">Back to Home</a>

    <!-- SEARCH BAR -->
    <input
      type="text"
      id="searchBar"
      class="search-bar"
      placeholder="Search events..."
    />

    <!-- WEEKLY VIEW TOGGLE + CONTAINER -->
    <button id="toggleWeekView" class="week-btn">Weekly View</button>
    <div id="weekView" class="week-view"></div>

    <div class="calendar-wrapper">
      <div class="month-header">
        <button id="prevMonth" class="nav-btn">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" class="nav-btn">›</button>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>
    </div>

    <div class="event-sidebar">
      <h2>Add Event</h2>

      <label>Date</label>
      <input type="date" id="eventDate" />

      <label>Time</label>
      <input type="time" id="eventTime" />

      <label>Title</label>
      <input type="text" id="eventTitle" placeholder="Event title" />

      <label>Category</label>
      <select id="eventCategory">
        <option value="Date Night">Date Night</option>
        <option value="Hangout">Hangout</option>
        <option value="Reminder">Reminder</option>
        <option value="Trip">Trip</option>
        <option value="Important">Important</option>
      </select>

      <label>Color</label>
      <input type="color" id="eventColor" value="#6aaa64" />

      <button id="saveEvent">Save Event</button>

      <h2>Events</h2>
      <div id="eventList"></div>
    </div>

    <div id="eventPopup" class="event-popup">
      <button id="closePopup" class="popup-close">X</button>
      <div id="popupContent"></div>
    </div>

    <script src="calendar.js"></script>
  </body>
</html>
